[package]
name = "sith-gui"
description = "Graphical browser for 16-bit Windows NE binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sith-gui"
path = "src/main.rs"

[dependencies]
ne-core.workspace = true
ne-disasm.workspace = true
ne-analysis.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.36"
rfd = "0.17"
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }

# Both display servers, but only where they exist. Naming them
# unconditionally makes the crate unbuildable on Windows and macOS.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
