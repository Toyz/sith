[package]
name = "sith-gui"
description = "Graphical browser for 16-bit Windows NE binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sith-gui"
path = "src/main.rs"

[dependencies]
ne-core.workspace = true
ne-disasm.workspace = true
ne-analysis.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.36"
rfd = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
